services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ironed_out
      POSTGRES_USER: ironed_owner
      POSTGRES_PASSWORD: ironed_owner_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ironed_owner -d ironed_out']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
