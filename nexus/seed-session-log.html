      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      min-height: 100vh;

      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 4rem;

      text-align: center;
      margin-bottom: 2.5rem;

    .tool-eyebrow {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      color: var(--violet);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
      opacity: 0.7;
    }
    .tool-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--violet);
      letter-spacing: 0.12em;
      text-shadow: 0 0 30px rgba(167,139,250,0.4), 0 0 70px rgba(167,139,250,0.1);
    }
    .tool-sub {

      font-size: 0.65rem;
      color: var(--text-dim);

      margin-top: 0.3rem;

      margin-bottom: 1.2rem;

      font-size: 0.65rem;

      letter-spacing: 0.2em;
      color: var(--text-dim);
      text-transform: uppercase;

      margin-bottom: 0.5rem;

      border: 1px solid rgba(167,139,250,0.12);

      font-family: 'Orbitron', sans-serif;

      border: 1px solid rgba(167,139,250,0.35);

      color: var(--red);

      background: transparent;

// ══════════════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════════════
function uid() { return '_' + Math.random().toString(36).slice(2, 11); }
function slugify(s) {
  return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
function isoToday() { return new Date().toISOString().slice(0,10); }
function isoDate(daysAgo) {
  const d = new Date(); d.setDate(d.getDate() - daysAgo);
  return d.toISOString().slice(0,10);
}

// ── DB wrapper (mirrors nexus-config.js) ──────────────────────
function makeDB(url, key) {
  const headers = () => ({
    'Content-Type':  'application/json',
    'apikey':         key,
    'Authorization': `Bearer ${key}`,
    'Prefer':        'return=representation',
  });
  async function req(path, opts = {}) {
    const r = await fetch(url + '/rest/v1/' + path, { headers: headers(), ...opts });
    const text = await r.text();
    if (!r.ok) throw new Error(`${opts.method||'GET'} ${path}: ${text}`);
    return text ? JSON.parse(text) : [];
  }
  return {
    select:   (t, q='') => req(`${t}?select=*${q}`),
    upsert:   (t, rows) => req(t, {
      method:  'POST',
      headers: { ...headers(), Prefer: 'resolution=merge-duplicates,return=representation' },
      body:    JSON.stringify(Array.isArray(rows) ? rows : [rows]),
    }),
    deleteWhere: (t, f) => req(`${t}?${f}`, { method: 'DELETE' }),
  };
}

// ── Logging ───────────────────────────────────────────────────
const logEl    = () => document.getElementById('logWrap');
const bannerEl = () => document.getElementById('summaryBanner');
function log(msg, cls = '') {
  const wrap = logEl();
  const line = document.createElement('div');
  line.className = 'log-line' + (cls ? ' ' + cls : '');
  line.textContent = msg;
  wrap.appendChild(line);
  wrap.scrollTop = wrap.scrollHeight;
}
function clearLog() {
  logEl().innerHTML = '';
  const b = bannerEl();
  b.style.display = 'none';
  b.className = 'summary-banner';
}
function banner(msg, isOk) {
  const b = bannerEl();
  b.style.display = 'block';
  b.className = 'summary-banner ' + (isOk ? 'ok' : 'err');
  b.textContent = msg;
}
function setBusy(id, on) {
  document.getElementById('btnSeed').disabled = on;
  document.getElementById('btnWipe').disabled = on;
  document.getElementById('spinner' + id).style.display = on ? 'inline-block' : 'none';
}

async function runWipe() {
  const confirmed = confirm(
    'WIPE + RE-SEED\n\n' +
    'This will DELETE all existing rows in:\n' +

  if (!confirmed) return;

  setBusy('Wipe', true);
  const db = makeDB(SEED_URL, SEED_KEY);

  log('── Wiping existing data ──────────────────────', 'head');
  try {
    // Delete in FK-safe order: events first, then sessions, then npcs
    await db.deleteWhere('session_events', 'id=gt.'); log('  ✓ session_events cleared', 'ok');
    await db.deleteWhere('session_log',    'id=gt.'); log('  ✓ session_log cleared',    'ok');
    await db.deleteWhere('npcs',           'id=gt.'); log('  ✓ npcs cleared',            'ok');
  } catch(e) {
    log('  ✗ Wipe failed: ' + e.message, 'err');
    banner('✗ Wipe failed — see log for details.', false);
    setBusy('Wipe', false);
    return;
  }

  await _doSeed(db);
  setBusy('Wipe', false);
}

async function _doSeed(db) {
  const { NPCS_DEF, SESSIONS_DEF } = buildSeedData();

  let npcRows      = [];
  let sessionRows  = [];
  let eventRows    = [];
  let errors       = 0;

  // ── 1. Insert NPCs ─────────────────────────────────────────
  log('── Seeding NPCs ──────────────────────────────', 'head');
  const npcIds = [];    // parallel to NPCS_DEF by index

  for (const def of NPCS_DEF) {
    const id   = uid();
    const slug = slugify(def.name);
    npcIds.push(id);
    npcRows.push({
      id, slug,
      name:        def.name,
      role:        def.role,
      disposition: def.disposition,
      notes:       def.notes,
      first_seen:  null,   // patched after sessions are inserted
    });
    log(`  + NPC: ${def.name} (^${slug}, ${def.disposition})`, 'info');
  }

  try {
    await db.upsert('npcs', npcRows);
    log(`  ✓ ${npcRows.length} NPCs inserted`, 'ok');
  } catch(e) {
    log('  ✗ NPC insert failed: ' + e.message, 'err');
    errors++;
  }

  // Build slug → id map for citation injection
  const slugToId = {};
  NPCS_DEF.forEach((def, i) => {
    slugToId[slugify(def.name)] = npcIds[i];
  });

  // ── 2. Insert Sessions + Events ────────────────────────────
  log('── Seeding Sessions ──────────────────────────', 'head');
  const sessionIds = [];   // parallel to SESSIONS_DEF

  for (const def of SESSIONS_DEF) {
    const sessionId   = uid();
    sessionIds.push(sessionId);

    const linkedNpcIds = (def.npc_indices || []).map(i => npcIds[i]);

    const sessionRow = {
      id:           sessionId,
      number:       def.number,
      title:        def.title,
      real_date:    def.real_date,
      world_date:   def.world_date,
      status:       def.status,
      summary:      def.summary,
      session_npcs: linkedNpcIds,
      quests:       (def.quests || []).map(q => ({ _key: uid(), text: q.text, status: q.status })),
    };

    sessionRows.push(sessionRow);
    log(`  + Session ${def.number}: "${def.title}" (${def.status}, ${linkedNpcIds.length} NPCs)`, 'info');

    // Build event rows
    (def.moments || []).forEach((m, i) => {
      eventRows.push({
        id:         uid(),
        session_id: sessionId,
        text:       m.text,
        members:    m.members || [],
        sort_order: i,
      });
    });
  }

  try {
    await db.upsert('session_log', sessionRows);
    log(`  ✓ ${sessionRows.length} sessions inserted`, 'ok');
  } catch(e) {
    log('  ✗ Session insert failed: ' + e.message, 'err');
    errors++;
  }

  // ── 3. Insert Events ───────────────────────────────────────
  log('── Seeding Moments ───────────────────────────', 'head');
  log(`  Inserting ${eventRows.length} moments across ${sessionRows.length} sessions…`, 'info');
  try {
    await db.upsert('session_events', eventRows);
    log(`  ✓ ${eventRows.length} moments inserted`, 'ok');
  } catch(e) {
    log('  ✗ Moment insert failed: ' + e.message, 'err');
    errors++;
  }

  // ── 4. Patch NPC first_seen ────────────────────────────────
  // For each NPC, find the earliest session it appears in and set first_seen
  log('── Patching NPC first_seen ────────────────────', 'head');
  const npcFirstSeen = {};   // npcId → sessionId of first appearance

  for (let si = 0; si < SESSIONS_DEF.length; si++) {
    const def       = SESSIONS_DEF[si];
    const sessionId = sessionIds[si];
    for (const npcIdx of (def.npc_indices || [])) {
      const npcId = npcIds[npcIdx];
      if (!npcFirstSeen[npcId]) npcFirstSeen[npcId] = sessionId;
    }
  }

  let fsPatched = 0;
  const fsRows = Object.entries(npcFirstSeen).map(([npcId, sessionId]) => {
    const npcRow = npcRows.find(n => n.id === npcId);
    fsPatched++;
    return { ...npcRow, first_seen: sessionId };
  });

  if (fsRows.length) {
    try {
      await db.upsert('npcs', fsRows);
      log(`  ✓ first_seen patched for ${fsPatched} NPCs`, 'ok');
    } catch(e) {
      log('  ✗ first_seen patch failed: ' + e.message, 'err');
      errors++;
    }
  }

  // ── Summary ────────────────────────────────────────────────
  log('', '');
  const totalMoments = eventRows.length;
  const totalQuests  = sessionRows.reduce((sum, s) => sum + (s.quests||[]).length, 0);

  if (errors === 0) {
    log('✓ Seed complete', 'ok');
    banner(
      `✓ Seed complete — ${npcRows.length} NPCs · ${sessionRows.length} sessions · ${totalMoments} moments · ${totalQuests} quests\n` +
      `Open session-log.html to see your data.`,
      true
    );
  } else {
    log(`⚠ Seed finished with ${errors} error(s) — see above`, 'warn');
    banner(`⚠ Seed finished with ${errors} error(s). Some data may be missing — check the log.`, false);
  }
}
</script>
