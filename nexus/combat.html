<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS // Combat</title>
  <script src="js/nexus-config.js"></script>
  <script src="js/nexus-utils.js"></script>
  <script src="js/nexus-srd.js"></script>
  <script src="js/nexus-combat-editor.js"></script>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/nexus.css" />
</head>
<body class="has-sidenav page-combat">

<div id="loadingOverlay">
  <div class="loading-text">LOADING…</div>
</div>

<div id="nexus-nav-root"></div>

<header>
  <div class="brand">
    <div class="brand-top">⚙ nexus // tactical reference</div>
    <div class="brand-name" id="combatTitle">COMBAT</div>
    <div class="brand-sub">attacks &amp; spells, ranked</div>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" id="btnAddOption" data-action="add-option">+ Add Option</button>
  </div>
</header>

<div class="hline"></div>

<main>
  <div class="cb-tabs" id="cbTabs" role="tablist"></div>

  <div class="cb-target" id="cbTarget"></div>

  <div id="cbSheet"></div>
</main>

<!-- DM TARGET MODAL -->
<div class="modal-backdrop" id="targetModal">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <span class="modal-title">🎯 DM TARGET</span>
      <button class="btn-icon" data-action="close-target">✕</button>
    </div>
    <div class="modal-body">
      <div class="hint-text">Every character's sheet ranks against this one target. Use the AC and a typical save bonus of what the party is fighting.</div>
      <div class="field-row">
        <div class="field"><label for="tgtAc">Target AC</label><input type="number" id="tgtAc" min="1" max="40" /></div>
        <div class="field"><label for="tgtSave">Save Bonus</label><input type="number" id="tgtSave" min="-5" max="20" /></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-action="close-target">Cancel</button>
      <button class="btn btn-primary" id="btnSaveTarget" data-action="save-target">Save Target</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
let members    = [];
let items      = [];   // loot rows mapped to { statEffects } for computeNetEffects
let options    = [];   // combat_options rows
let selectedId = null; // member id whose sheet is showing

const CB_LAST_KEY = 'nexus_combat_member';

// Stats that matter on a combat sheet, for the "buffs in play" list
const CB_STAT_LABELS = {
  str: 'STR', dex: 'DEX', con: 'CON', int: 'INT', wis: 'WIS', cha: 'CHA',
  prof_bonus: 'Prof Bonus', attack_rolls: 'Attack Rolls', damage_rolls: 'Damage Rolls',
  spell_attack: 'Spell Atk', spell_dc: 'Spell DC', spell_damage: 'Spell Dmg',
};

const ACTION_COLUMNS = [
  { key: 'action',   label: 'Action' },
  { key: 'bonus',    label: 'Bonus Action' },
  { key: 'reaction', label: 'Reaction' },
];

function showLoading(on) {
  const el = document.getElementById('loadingOverlay');
  if (el) el.style.display = on ? 'flex' : 'none';
}

// ══════════════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════════════
async function boot() {
  showLoading(true);
  let guarded = false;
  try {
    const [, , memberRows, itemRows, optionRows] = await Promise.all([
      loadModuleSettings(),
      loadTerms().catch(() => {}),
      db.select('party_members',  { order: 'created_at.asc' }),
      db.select('loot_items'),
      // Fails until sql/supabase_combat.sql has been run; keep the page usable
      db.select('combat_options', { order: 'sort_order.asc,created_at.asc' }).catch(e => {
        console.error(e);
        showToast('combat_options table missing — run sql/supabase_combat.sql in Supabase.');
        return [];
      }),
      loadCombatTarget(),
    ]);
    buildSidenav('combat.html');
    applyModuleVisibility();
    applyReadOnlyBanner();
    if (!enforceModuleGuard('combat')) { guarded = true; return; }
    document.getElementById('combatTitle').textContent = t('combat').toUpperCase();
    members = memberRows;
    items   = itemRows.map(r => ({
      id: r.id, name: r.name, type: r.type, rarity: r.rarity, holder: r.holder,
      statEffects: r.stat_effects || [],
    }));
    options = optionRows;
    selectedId = pickInitialMember();
  } catch(e) {
    console.error(e);
    showToast('Could not load combat data — check your Supabase config.');
  } finally {
    if (!guarded) showLoading(false);
  }
  wireEvents();
  render();
}

// ?member=<id> wins, then this browser's last-viewed sheet, then the first member
function pickInitialMember() {
  const fromUrl = new URLSearchParams(location.search).get('member');
  let fromStore = null;
  try { fromStore = localStorage.getItem(CB_LAST_KEY); } catch(e) {}
  for (const id of [fromUrl, fromStore]) {
    if (id && members.some(m => m.id === id)) return id;
  }
  return members[0]?.id || null;
}

function selectMember(id) {
  if (!members.some(m => m.id === id)) return;
  selectedId = id;
  try { localStorage.setItem(CB_LAST_KEY, id); } catch(e) {}
  const url = new URL(location.href);
  url.searchParams.set('member', id);
  history.replaceState(null, '', url);
  render();
}

// ══════════════════════════════════════════════════════════════
//  MATH CONTEXT
// ══════════════════════════════════════════════════════════════
// All of a member's item effects, for the summary line and the buffs list
function memberNet(member) {
  return computeNetEffects(member.name, items);
}

// Per-option maths context: weapon attack/damage bonuses only count for
// the option linked to that weapon (see combatContext in nexus-utils.js)
function contextFor(member) {
  return option => combatContext(member, items, option, COMBAT_TARGET);
}

function memberOptions(member) {
  return options.filter(o => o.member_id === member.id);
}

// ══════════════════════════════════════════════════════════════
//  FORMATTERS
// ══════════════════════════════════════════════════════════════
function fmtNum(x) {
  return (Math.round(x * 10) / 10).toFixed(1).replace(/\.0$/, '');
}

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

// "STR +4", but "Longsword +1 (+1)" when the label itself ends in a number
function partText(p) {
  return /\d$/.test(p.label) ? `${esc(p.label)} (${modStr(p.value)})` : `${esc(p.label)} ${modStr(p.value)}`;
}

function partsText(parts) {
  return parts.map(partText).join(' · ');
}

function resolveText(o, b) {
  if (o.resolve === 'attack' && b.toHit) return b.toHit.missing ? 'Spell Atk not set' : modStr(b.toHit.total) + ' to hit';
  if (o.resolve === 'save' && b.dc)      return `${b.dc.missing ? 'Spell DC not set' : 'DC ' + b.dc.total}${o.save_ability ? ' ' + esc(o.save_ability.toUpperCase()) : ''}`;
  if (o.resolve === 'auto')              return 'auto-hit';
  return 'utility';
}

function damageText(o, b) {
  if (!b.damage) return '';
  const type = o.damage_type ? ' ' + esc(o.damage_type) : '';
  return `${esc(b.damage.diceText)}${type} · ${fmtNum(b.damage.perHit)} avg`;
}

function optionTags(o, b) {
  const tags = [];
  if (b.attacks > 1) tags.push(`×${b.attacks} attacks`);
  if (o.spell_level === 0) tags.push('cantrip');
  else if (o.spell_level > 0) tags.push(`${ordinal(o.spell_level)} slot`);
  if (o.kind === 'feature') tags.push('feature');
  if (o.aoe) tags.push('AoE');
  if (o.range) tags.push(esc(o.range));
  if (isAtWill(o)) tags.push('at-will');
  if (!isPrepared(o)) tags.push('not prepared');
  return tags.map(tag => `<span class="cb-tag${tag === 'at-will' ? ' cb-tag-will' : tag === 'not prepared' ? ' cb-tag-unprep' : ''}">${tag}</span>`).join('');
}

// The "why is this number what it is" panel shown when an option is expanded
function breakdownHtml(o, b, expected) {
  const rows = [];
  if (b.toHit) {
    const pct = Math.round(hitChance(b.toHit.total, COMBAT_TARGET.ac) * 100);
    rows.push(`<div><span class="cb-bd-k">To hit</span> ${modStr(b.toHit.total)} = ${partsText(b.toHit.parts)} <span class="cb-bd-odds">${pct}% vs AC ${COMBAT_TARGET.ac}</span></div>`);
  }
  if (b.dc) {
    const pct = Math.round(saveFailChance(b.dc.total, COMBAT_TARGET.save) * 100);
    const parts = b.dc.parts.map(p => `${esc(p.label)} ${p.label === 'Base' || p.label === 'Spell DC' ? p.value : modStr(p.value)}`).join(' · ');
    rows.push(`<div><span class="cb-bd-k">Save DC</span> ${b.dc.total} = ${parts} <span class="cb-bd-odds">${pct}% fail vs ${modStr(COMBAT_TARGET.save)}${o.half_on_save ? ', half on save' : ''}</span></div>`);
  }
  if (b.damage) {
    const parts = b.damage.parts.map((p, i) => i === 0 || (b.damage.extra && i === 1)
      ? `${esc(p.label)} (${fmtNum(p.value)})`
      : partText(p)).join(' · ');
    rows.push(`<div><span class="cb-bd-k">Damage</span> ${fmtNum(b.damage.perHit)} avg = ${parts}</div>`);
  }
  if (expected > 0) {
    const per = b.attacks > 1 ? ` (${fmtNum(expected / b.attacks)} × ${b.attacks})` : '';
    rows.push(`<div><span class="cb-bd-k">Expected</span> ~${fmtNum(expected)} per turn${per}</div>`);
  }
  if (o.loot_item_id) {
    const it = items.find(i => i.id === o.loot_item_id);
    if (it) rows.push(`<div><span class="cb-bd-k">Item</span> ${esc(it.name)}</div>`);
  }
  if (o.kind === 'spell') {
    const cast = [o.casting_time, o.components, o.duration, o.concentration ? 'Concentration' : '', o.ritual ? 'Ritual' : '']
      .filter(Boolean).map(esc).join(' · ');
    if (cast) rows.push(`<div><span class="cb-bd-k">Cast</span> ${cast}</div>`);
  }
  if (o.notes) rows.push(`<div class="cb-bd-notes">${esc(o.notes)}</div>`);
  if (o.description) rows.push(`<div class="cb-bd-notes cb-bd-desc">${esc(o.description)}</div>`);
  const canPrep = o.kind === 'spell' && o.spell_level > 0;
  rows.push(`<div class="cb-bd-actions">
    ${canPrep ? `<button class="btn btn-ghost" data-action="toggle-prep" data-id="${esc(o.id)}">${isPrepared(o) ? '○ Unprepare' : '● Prepare'}</button>` : ''}
    <button class="btn btn-ghost" data-action="edit-option" data-id="${esc(o.id)}">✎ Edit</button>
    <button class="btn btn-ghost cb-del" data-action="delete-option" data-id="${esc(o.id)}">✕ Remove</button>
  </div>`);
  return `<div class="cb-breakdown">${rows.join('')}</div>`;
}

// ══════════════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════════════
function render() {
  renderTabs();
  renderTarget();
  renderSheet();
}

function renderTabs() {
  const el = document.getElementById('cbTabs');
  el.innerHTML = members.map(m => {
    const count = options.filter(o => o.member_id === m.id).length;
    const active = m.id === selectedId;
    return `<button class="cb-tab${active ? ' active' : ''}" role="tab" aria-selected="${active}"
              data-action="select-member" data-id="${esc(m.id)}">
              ${esc(m.name)}<span class="cb-tab-count">${count}</span>
            </button>`;
  }).join('');
}

function renderTarget() {
  document.getElementById('cbTarget').innerHTML = `
    <span class="cb-target-label">🎯 DM target</span>
    <span class="cb-target-val">AC ${COMBAT_TARGET.ac}</span>
    <span class="cb-target-val">Save ${modStr(COMBAT_TARGET.save)}</span>
    <button class="btn btn-ghost cb-target-btn" data-action="edit-target">Set</button>`;
}

function renderSheet() {
  const root = document.getElementById('cbSheet');
  const member = members.find(m => m.id === selectedId);
  document.getElementById('btnAddOption').style.display = member ? '' : 'none';
  if (!member) {
    root.innerHTML = `<div class="empty-state"><span class="ei">🗡️</span>
      <p>No ${esc(t('members').toLowerCase())} yet — add characters in the ${esc(t('partyRoster'))}</p></div>`;
    return;
  }

  const { net, relevant } = memberNet(member);
  const ctxFor = contextFor(member);
  const mine = memberOptions(member);
  const { ranked, top, bestAtWill } = rankCombatOptions(mine, ctxFor);
  const scored = new Map(ranked.map(r => [r.option.id, r]));

  root.innerHTML = `
    ${summaryHtml(member, net)}
    ${mine.length ? '' : `<div class="empty-state cb-empty"><span class="ei">⚔</span>
      <p>No attacks or spells on this sheet yet</p>
      <button class="btn btn-cyan cb-empty-btn" data-action="add-option">+ Add the first one</button></div>`}
    ${top.length ? `
      <div class="cb-section-label">Top picks</div>
      <div class="cb-top">
        ${top.map((r, i) => pickCardHtml(r, i + 1)).join('')}
      </div>` : ''}
    ${bestAtWill ? `
      <div class="cb-atwill">
        <span class="cb-atwill-label">Best at-will</span>
        ${optionRowHtml(bestAtWill.option, bestAtWill.breakdown, bestAtWill.expected)}
      </div>` : ''}
    ${mine.length ? `
      <div class="cb-section-label">All options</div>
      <div class="cb-columns">
        ${ACTION_COLUMNS.map(col => columnHtml(col, mine, ctxFor, scored)).join('')}
      </div>` : ''}
    ${buffsHtml(relevant)}`;
}

function summaryHtml(m, net) {
  const cs = m.combat || {};
  const prof = effectiveProf(m, net);
  const bits = [];
  if (m.level) bits.push(`LVL ${esc(m.level)}`);
  if (m.class) bits.push(esc(m.class));
  bits.push(`Prof ${modStr(prof)}`);
  const attacks = Math.max(1, parseInt(cs.attacks, 10) || 1);
  if (attacks > 1) bits.push(`Attacks ×${attacks}`);
  if (cs.spellatk != null && cs.spellatk !== '') {
    const fx = (net.spell_attack?.bonus || 0) - (net.spell_attack?.penalty || 0);
    bits.push(`Spell Atk ${modStr((parseInt(cs.spellatk, 10) || 0) + fx)}`);
  }
  if (cs.spelldc) {
    const fx = (net.spell_dc?.bonus || 0) - (net.spell_dc?.penalty || 0);
    bits.push(`Spell DC ${(parseInt(cs.spelldc, 10) || 0) + fx}`);
  }
  return `<div class="cb-summary">${bits.map(b => `<span>${b}</span>`).join('')}</div>`;
}

function pickCardHtml(r, rank) {
  const o = r.option, b = r.breakdown;
  return `
    <details class="cb-pick">
      <summary>
        <span class="cb-pick-rank">${rank}</span>
        <span class="cb-pick-main">
          <span class="cb-pick-name">${esc(o.name)}</span>
          <span class="cb-pick-line">${resolveText(o, b)} · ${damageText(o, b)}</span>
          <span class="cb-tags">${optionTags(o, b)}</span>
        </span>
        <span class="cb-pick-exp" title="Expected damage per turn vs the DM target">~${fmtNum(r.expected)}</span>
      </summary>
      ${breakdownHtml(o, b, r.expected)}
    </details>`;
}

function optionRowHtml(o, b, expected) {
  return `
    <details class="cb-opt${isPrepared(o) ? '' : ' cb-unprepared'}">
      <summary>
        <span class="cb-opt-main">
          <span class="cb-opt-name">${esc(o.name)}</span>
          <span class="cb-opt-line">${resolveText(o, b)}${b.damage ? ' · ' + damageText(o, b) : ''}</span>
        </span>
        ${expected > 0 ? `<span class="cb-opt-exp">~${fmtNum(expected)}</span>` : ''}
      </summary>
      <div class="cb-tags">${optionTags(o, b)}</div>
      ${breakdownHtml(o, b, expected)}
    </details>`;
}

function columnHtml(col, mine, ctxFor, scored) {
  const list = mine
    .filter(o => (o.action || 'action') === col.key)
    .map(o => scored.get(o.id) || { option: o, breakdown: combatBreakdown(o, ctxFor(o)), expected: 0 })
    .sort((a, b) => (b.expected - a.expected) || String(a.option.name).localeCompare(String(b.option.name)));
  return `
    <div class="cb-col">
      <div class="cb-col-head">${col.label}<span class="cb-col-count">${list.length}</span></div>
      ${list.length
        ? list.map(r => optionRowHtml(r.option, r.breakdown, r.expected)).join('')
        : '<div class="cb-col-empty">—</div>'}
    </div>`;
}

function buffsHtml(relevant) {
  const rows = [];
  for (const it of relevant) {
    const fx = (it.statEffects || []).filter(f => CB_STAT_LABELS[f.stat]);
    if (!fx.length) continue;
    const weaponOnly = isWeaponItem(it);
    const pills = fx.map(f => {
      const scoped = weaponOnly && WEAPON_SCOPED_STATS.includes(f.stat) ? ' (this weapon)' : '';
      const label = CB_STAT_LABELS[f.stat] + (f.damageType ? ` (${esc(f.damageType)})` : '') + scoped;
      if (f.type === 'bonus')        return `<span class="fx-pill fx-pos">+${esc(f.value)} ${label}</span>`;
      if (f.type === 'penalty')      return `<span class="fx-pill fx-neg">−${esc(f.value)} ${label}</span>`;
      if (f.type === 'advantage')    return `<span class="fx-pill fx-adv">Adv: ${label}</span>`;
      if (f.type === 'disadvantage') return `<span class="fx-pill fx-dis">Dis: ${label}</span>`;
      if (f.type === 'set')          return `<span class="fx-pill fx-set">${label} = ${esc(f.value)}</span>`;
      return '';
    }).join('');
    const who = (it.holder || '').toLowerCase().trim() === 'party' ? ` <span class="cb-buff-who">${esc(t('partyInventory'))}</span>` : '';
    rows.push(`<div class="cb-buff"><span class="cb-buff-name">${esc(it.name)}${who}</span><span class="cb-buff-fx">${pills}</span></div>`);
  }
  if (!rows.length) return '';
  return `<div class="cb-section-label">Buffs in play</div><div class="cb-buffs">${rows.join('')}</div>`;
}

// ══════════════════════════════════════════════════════════════
//  DM TARGET
// ══════════════════════════════════════════════════════════════
const openTargetModal = requireAdmin(async () => {
  document.getElementById('tgtAc').value   = COMBAT_TARGET.ac;
  document.getElementById('tgtSave').value = COMBAT_TARGET.save;
  document.getElementById('targetModal').classList.add('open');
  document.getElementById('tgtAc').focus();
});

function closeTargetModal() {
  document.getElementById('targetModal').classList.remove('open');
}

async function saveTarget() {
  if (!(await nexusGate())) return;
  const btn = document.getElementById('btnSaveTarget');
  setLoading(btn, true);
  try {
    await saveCombatTarget({
      ac:   document.getElementById('tgtAc').value,
      save: document.getElementById('tgtSave').value,
    });
    closeTargetModal();
    render();
    showToast(`Target set: AC ${COMBAT_TARGET.ac}, save ${modStr(COMBAT_TARGET.save)}`);
  } catch(e) {
    console.error(e);
    showToast('Could not save the target — check Supabase config.');
  } finally {
    setLoading(btn, false);
  }
}

// ══════════════════════════════════════════════════════════════
//  ADD / EDIT / REMOVE — the modal lives in js/nexus-combat-editor.js,
//  shared with the roster's Spells tab
// ══════════════════════════════════════════════════════════════
function selectedMember() {
  return members.find(m => m.id === selectedId) || null;
}

function openOptionEditor(id) {
  const member = selectedMember();
  if (!member) return;
  const option = id ? options.find(o => o.id === id) || null : null;
  CombatEditor.open({
    member, items, option,
    onSaved: ({ option: saved, isNew, lootItem }) => {
      options = isNew ? [...options, saved] : options.map(o => o.id === saved.id ? saved : o);
      if (lootItem) items.push(lootItem);
      render();
    },
  });
}

function deleteOption(id) {
  const o = options.find(x => x.id === id);
  CombatEditor.remove(o, () => { options = options.filter(x => x.id !== id); render(); });
}

async function togglePrepared(id) {
  if (!(await nexusGate())) return;
  const o = options.find(x => x.id === id);
  if (!o) return;
  const prepared = !isPrepared(o);
  try {
    await db.update('combat_options', id, { prepared });
    options = options.map(x => x.id === id ? { ...x, prepared } : x);
    render();
  } catch(e) {
    console.error(e);
    showToast('Could not update — check Supabase config.');
  }
}

// ══════════════════════════════════════════════════════════════
//  EVENTS — one delegated listener; record ids travel in data-*
//  attributes, never interpolated into inline handlers.
// ══════════════════════════════════════════════════════════════
function wireEvents() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const id = el.dataset.id;
    switch (el.dataset.action) {
      case 'select-member': selectMember(id); break;
      case 'edit-target':   openTargetModal(); break;
      case 'close-target':  closeTargetModal(); break;
      case 'save-target':   saveTarget(); break;
      case 'add-option':    openOptionEditor(null); break;
      case 'edit-option':   openOptionEditor(id); break;
      case 'delete-option': deleteOption(id); break;
      case 'toggle-prep':   togglePrepared(id); break;
    }
  });
  document.getElementById('targetModal').addEventListener('click', e => {
    if (e.target.id === 'targetModal') closeTargetModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeTargetModal();
    if (e.key === 'Enter' && document.getElementById('targetModal').classList.contains('open')) saveTarget();
  });
}

boot();
</script>

</body>
</html>
