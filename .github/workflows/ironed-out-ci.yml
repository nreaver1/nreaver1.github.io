# Ironed Out: typecheck, lint, unit tests, migrations on real Postgres/PostGIS, and Playwright.
# Lives at the repo root (GitHub only reads workflows here) and only runs for ironed-out/ changes.
name: Ironed Out CI

on:
  push:
    branches: [master]
    paths: ['ironed-out/**', '.github/workflows/ironed-out-ci.yml']
  pull_request:
    paths: ['ironed-out/**', '.github/workflows/ironed-out-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ironed-out-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ironed-out

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ironed-out/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ironed-out/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  migrations:
    # Unit tests use PGlite; this applies the migrations to the real Postgres/PostGIS image too.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: ironed_out
          POSTGRES_USER: ironed_owner
          POSTGRES_PASSWORD: ironed_owner_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ironed_owner -d ironed_out"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgres://ironed_owner:ironed_owner_dev@localhost:5432/ironed_out
      PGPASSWORD: ironed_owner_dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ironed-out/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ironed-out/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: psql -h localhost -U ironed_owner -d ironed_out -f docker/initdb/01-app-role.sql
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm db:seed # idempotent

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ironed-out/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ironed-out/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ironed-out/test-results/
          retention-days: 7
