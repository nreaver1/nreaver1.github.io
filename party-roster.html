<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PARTY ROSTER // Crew Registry</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #060809;
      --bg2:       #0a0d12;
      --panel:     #0b0f18;
      --border:    #1a2a3a;
      --amber:     #d4860a;
      --gold:      #f0a832;
      --gold-hot:  #ffe066;
      --cyan:      #0ef0d0;
      --cyan-dim:  #0a8a78;
      --red:       #e03c3c;
      --green:     #3ce08a;
      --text:      #c8d8f0;
      --text-dim:  #3a5070;
      --glow-g:    rgba(240,168,50,0.18);
      --glow-c:    rgba(14,240,208,0.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 10% 10%, rgba(14,240,208,0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 90% 90%, rgba(240,168,50,0.04) 0%, transparent 50%),
        repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(14,240,208,0.025) 59px, rgba(14,240,208,0.025) 60px),
        repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(14,240,208,0.015) 59px, rgba(14,240,208,0.015) 60px);
      font-family: 'Rajdhani', sans-serif;
      color: var(--text);
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px);
      pointer-events: none;
      z-index: 9999;
    }

    /* ── HEADER ── */
    header {
      padding: 2rem 2rem 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .brand { display: flex; flex-direction: column; gap: 0.2rem; }
    .brand-top { font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; color: var(--cyan-dim); letter-spacing: 0.3em; text-transform: uppercase; }
    .brand-name { font-family: 'Orbitron', sans-serif; font-size: clamp(1.4rem, 4vw, 2.2rem); font-weight: 900; color: var(--cyan); text-shadow: 0 0 20px var(--cyan-dim), 0 0 50px rgba(14,240,208,0.2); letter-spacing: 0.08em; line-height: 1; }
    .brand-sub { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; color: var(--gold); letter-spacing: 0.25em; opacity: 0.6; margin-top: 2px; }
    .header-actions { display: flex; gap: 0.6rem; align-items: center; padding-top: 0.5rem; flex-wrap: wrap; }

    .hline { height: 1px; background: linear-gradient(to right, transparent, var(--amber), var(--cyan-dim), var(--amber), transparent); margin: 1.2rem 2rem; opacity: 0.4; }

    /* ── MAIN ── */
    main { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem 5rem; }

    /* ── MEMBER COUNT BAR ── */
    .roster-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.8rem;
      padding: 0.9rem 1.3rem;
      background: rgba(14,240,208,0.03);
      border: 1px solid rgba(14,240,208,0.12);
      border-radius: 4px;
    }
    .roster-stats { display: flex; gap: 2rem; flex-wrap: wrap; }
    .rstat { display: flex; flex-direction: column; gap: 2px; }
    .rstat-val { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 700; color: var(--cyan); }
    .rstat-label { font-family: 'Share Tech Mono', monospace; font-size: 0.52rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); }

    /* ── ROSTER GRID ── */
    .roster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    /* ── MEMBER CARD ── */
    .member-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      animation: cardIn 0.3s ease both;
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(12px) scale(0.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    .member-card:hover { border-color: rgba(14,240,208,0.3); box-shadow: 0 0 24px rgba(14,240,208,0.08), 0 8px 32px rgba(0,0,0,0.4); transform: translateY(-2px); }

    /* top accent line */
    .member-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(to right, var(--member-color, var(--cyan)), transparent);
      opacity: 0.7;
    }

    .card-portrait-area {
      position: relative;
      background: rgba(14,240,208,0.03);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      gap: 1.2rem;
    }

    .portrait-ring {
      width: 88px; height: 88px;
      border-radius: 50%;
      border: 2px solid var(--member-color, var(--cyan-dim));
      box-shadow: 0 0 16px var(--member-color, rgba(14,240,208,0.2));
      position: relative;
      flex-shrink: 0;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
      overflow: hidden;
      background: var(--bg2);
    }
    .portrait-ring:hover { box-shadow: 0 0 24px var(--member-color, rgba(14,240,208,0.4)); transform: scale(1.04); }

    .portrait-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
    .portrait-initials {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem; font-weight: 900;
      color: var(--member-color, var(--cyan));
      text-shadow: 0 0 12px var(--member-color, var(--cyan-dim));
    }
    .portrait-upload-hint {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.5rem;
      letter-spacing: 0.12em;
      color: var(--cyan);
      text-align: center;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .portrait-ring:hover .portrait-upload-hint { opacity: 1; }
    .portrait-upload-hint input { display: none; }

    .card-id-area { flex: 1; }
    .member-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.08em;
      line-height: 1.2;
      margin-bottom: 0.25rem;
    }
    .member-class {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--member-color, var(--cyan-dim));
      margin-bottom: 0.15rem;
    }
    .member-race {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .member-level {
      display: inline-block;
      margin-top: 0.4rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--bg);
      background: var(--member-color, var(--cyan));
      padding: 0.15rem 0.5rem;
      border-radius: 2px;
    }

    .card-body { padding: 1rem 1.2rem; }
    .member-bio {
      font-size: 0.9rem;
      color: var(--text-dim);
      line-height: 1.5;
      font-style: italic;
      margin-bottom: 0.8rem;
      min-height: 2.5em;
    }

    .card-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.8rem; }
    .tag {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.5rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.18rem 0.5rem;
      border-radius: 2px;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }

    .card-footer {
      border-top: 1px solid var(--border);
      padding: 0.65rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .member-player {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.54rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }
    .member-player span { color: var(--gold); }
    .card-actions { display: flex; gap: 0; }

    /* ADD card */
    .add-card {
      background: transparent;
      border: 1px dashed rgba(14,240,208,0.2);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      padding: 2.5rem 1rem;
      transition: border-color 0.2s, background 0.2s;
      min-height: 260px;
    }
    .add-card:hover { border-color: var(--cyan-dim); background: rgba(14,240,208,0.03); }
    .add-card-icon { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; color: var(--cyan-dim); line-height: 1; }
    .add-card-label { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-dim); }

    .empty-state { text-align: center; padding: 5rem 2rem; color: var(--text-dim); grid-column: 1/-1; }
    .empty-state .ei { font-size: 3rem; display: block; margin-bottom: 1rem; opacity: 0.3; }
    .empty-state p { font-family: 'Share Tech Mono', monospace; font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; }

    /* ── BUTTONS ── */
    .btn { font-family: 'Orbitron', sans-serif; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; padding: 0.5rem 1rem; border-radius: 3px; border: none; cursor: pointer; transition: all 0.16s; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 0.35rem; }
    .btn-primary { background: linear-gradient(135deg, var(--cyan-dim), #066050); color: #020f0d; box-shadow: 0 0 12px rgba(14,240,208,0.3); }
    .btn-primary:hover { filter: brightness(1.15); box-shadow: 0 0 20px rgba(14,240,208,0.5); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
    .btn-ghost:hover { border-color: var(--amber); color: var(--amber); }
    .btn-icon { background: none; border: none; cursor: pointer; font-size: 0.9rem; padding: 0.25rem 0.45rem; opacity: 0.35; transition: opacity 0.15s; color: var(--text); }
    .btn-icon:hover { opacity: 1; }
    .btn-icon.del:hover { color: var(--red); }

    /* ── MODAL ── */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; padding: 1rem; }
    .modal-backdrop.open { opacity: 1; pointer-events: all; }
    .modal { background: var(--bg2); border: 1px solid var(--cyan-dim); border-radius: 6px; width: 100%; max-width: 560px; box-shadow: 0 0 40px var(--glow-c), 0 20px 60px rgba(0,0,0,0.8); transform: translateY(10px) scale(0.98); transition: transform 0.2s; max-height: 92vh; overflow-y: auto; }
    .modal-backdrop.open .modal { transform: translateY(0) scale(1); }
    .modal-header { padding: 1.1rem 1.4rem 0.8rem; border-bottom: 1px solid rgba(14,240,208,0.15); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg2); z-index: 2; }
    .modal-title { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.2em; color: var(--cyan); text-shadow: 0 0 10px var(--cyan-dim); }
    .modal-body { padding: 1.3rem 1.4rem; display: flex; flex-direction: column; gap: 1rem; }
    .modal-footer { padding: 0.8rem 1.4rem 1.2rem; display: flex; justify-content: flex-end; gap: 0.6rem; }

    .field { display: flex; flex-direction: column; gap: 0.3rem; }
    .field-row { display: flex; gap: 0.8rem; }
    .field-row .field { flex: 1; }
    label { font-family: 'Share Tech Mono', monospace; font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--cyan-dim); }
    .optional { color: var(--text-dim); font-size: 0.5rem; margin-left: 4px; }

    input[type="text"], input[type="number"], select, textarea {
      background: rgba(14,240,208,0.04); border: 1px solid var(--border); border-radius: 3px;
      color: var(--text); font-family: 'Rajdhani', sans-serif; font-size: 1rem;
      padding: 0.45rem 0.75rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; width: 100%;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--cyan-dim); box-shadow: 0 0 8px var(--glow-c); }
    input::placeholder, textarea::placeholder { color: var(--text-dim); }
    select option { background: var(--bg2); color: var(--text); }
    textarea { resize: vertical; min-height: 70px; font-family: 'Rajdhani', sans-serif; }

    /* color picker */
    .color-row { display: flex; gap: 0.45rem; flex-wrap: wrap; align-items: center; }
    .cswatch { width: 26px; height: 26px; border-radius: 3px; border: 2px solid transparent; cursor: pointer; transition: transform 0.15s; flex-shrink: 0; }
    .cswatch:hover { transform: scale(1.12); }
    .cswatch.sel { border-color: #fff; box-shadow: 0 0 6px rgba(255,255,255,0.4); }
    .color-custom-wrap { width: 26px; height: 26px; border-radius: 3px; border: 1px solid var(--border); overflow: hidden; cursor: pointer; position: relative; }
    .color-custom-wrap input[type="color"] { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); border: none; cursor: pointer; opacity: 0.01; }
    .color-custom-wrap .cc-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: var(--text-dim); pointer-events: none; }

    /* photo upload in modal */
    .photo-upload-area {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }
    .photo-preview {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 2px solid var(--border);
      overflow: hidden;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      position: relative;
    }
    .photo-preview img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .photo-preview .photo-initials { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 900; color: var(--gold); }
    .photo-upload-btns { display: flex; flex-direction: column; gap: 0.4rem; }
    .photo-upload-btns .hint { font-family: 'Share Tech Mono', monospace; font-size: 0.52rem; color: var(--text-dim); letter-spacing: 0.08em; }

    /* TOAST */
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--bg2); border: 1px solid var(--cyan-dim); color: var(--cyan); font-family: 'Share Tech Mono', monospace; font-size: 0.62rem; letter-spacing: 0.15em; padding: 0.7rem 1.1rem; border-radius: 3px; box-shadow: 0 0 16px var(--glow-c); z-index: 2000; opacity: 0; pointer-events: none; transform: translateY(6px); transition: opacity 0.2s, transform 0.2s; }
    .toast.show { opacity: 1; pointer-events: all; transform: translateY(0); }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    @media (max-width: 600px) {
      header { padding: 1.2rem 1rem 0; }
      main { padding: 0 0.8rem 4rem; }
      .hline { margin: 1rem; }
      .field-row { flex-direction: column; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-top">⚙ nexus // crew registry</div>
    <div class="brand-name">PARTY ROSTER</div>
    <div class="brand-sub">active crew manifest</div>
  </div>
  <div class="header-actions">
    <a class="btn btn-ghost" href="index.html">← Dashboard</a>
    <button class="btn btn-ghost" onclick="importJSON()">⬆ Import</button>
    <button class="btn btn-ghost" onclick="exportJSON()">⬇ Export</button>
    <button class="btn btn-primary" onclick="openModal()">+ Add Member</button>
  </div>
</header>

<div class="hline"></div>

<main>
  <div class="roster-bar">
    <div class="roster-stats">
      <div class="rstat"><span class="rstat-val" id="statTotal">0</span><span class="rstat-label">Members</span></div>
      <div class="rstat"><span class="rstat-val" id="statAvgLevel">—</span><span class="rstat-label">Avg Level</span></div>
      <div class="rstat"><span class="rstat-val" id="statUniqueClasses">0</span><span class="rstat-label">Classes</span></div>
    </div>
    <div style="font-family:'Share Tech Mono',monospace;font-size:0.55rem;color:var(--text-dim);letter-spacing:0.12em">
      CLICK PORTRAIT TO CHANGE PHOTO
    </div>
  </div>

  <div class="roster-grid" id="rosterGrid"></div>
</main>

<!-- MEMBER MODAL -->
<div class="modal-backdrop" id="memberModal" onclick="backdropClose(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">⚙ ADD CREW MEMBER</span>
      <button class="btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">

      <!-- Photo -->
      <div class="field">
        <label>Portrait</label>
        <div class="photo-upload-area">
          <div class="photo-preview" id="photoPreview">
            <span class="photo-initials" id="photoInitials">?</span>
          </div>
          <div class="photo-upload-btns">
            <button class="btn btn-ghost" style="font-size:0.55rem" onclick="document.getElementById('photoFileInput').click()">⬆ Upload Image</button>
            <button class="btn btn-ghost" style="font-size:0.55rem;color:var(--red);border-color:rgba(224,60,60,0.3)" onclick="clearPhoto()">✕ Remove</button>
            <div class="hint">JPG, PNG, GIF — stored locally</div>
          </div>
        </div>
        <input type="file" id="photoFileInput" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)" />
      </div>

      <div class="field-row">
        <div class="field">
          <label>Character Name *</label>
          <input type="text" id="f-name" placeholder="e.g. Zyx Nightshade" oninput="updateModalPreview()" />
        </div>
        <div class="field">
          <label>Player Name <span class="optional">(optional)</span></label>
          <input type="text" id="f-player" placeholder="e.g. Alex" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Class</label>
          <input type="text" id="f-class" placeholder="e.g. Rogue, Netrunner…" />
        </div>
        <div class="field">
          <label>Race / Species</label>
          <input type="text" id="f-race" placeholder="e.g. Human, Cyborg…" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Level <span class="optional">(optional)</span></label>
          <input type="number" id="f-level" placeholder="1" min="1" max="99" />
        </div>
        <div class="field">
          <label>Status</label>
          <select id="f-status">
            <option value="active">Active</option>
            <option value="retired">Retired</option>
            <option value="deceased">Deceased</option>
            <option value="missing">MIA</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Card Color / Accent</label>
        <div class="color-row" id="modalColorRow"></div>
      </div>

      <div class="field">
        <label>Bio / Notes <span class="optional">(optional)</span></label>
        <textarea id="f-bio" placeholder="Background, personality, key info…"></textarea>
      </div>

      <div class="field">
        <label>Tags <span class="optional">(optional, comma-separated)</span></label>
        <input type="text" id="f-tags" placeholder="e.g. Tank, Healer, Stealth" />
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveMember()">Save Member</button>
    </div>
  </div>
</div>

<input type="file" id="fileImport" accept=".json" style="display:none" onchange="handleImport(event)" />
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════
//  CONSTANTS
// ══════════════════════════════
const COLORS = [
  '#0ef0d0','#f0a832','#3ce08a','#c07de8','#6a9fe8',
  '#e03c3c','#ff7a50','#f0e050','#e050a0','#80b0ff',
  '#60e890','#e8a050','#d4d4ff','#ff9060','#40d0c0'
];

const STATUS_LABEL = { active:'Active', retired:'Retired', deceased:'KIA', missing:'MIA' };

let members = [];
let editId = null;
let currentColor = COLORS[0];
let currentPhoto = null;  // base64 string or null

function uid() { return '_' + Math.random().toString(36).slice(2,11); }

// ══════════════════════════════
//  PERSIST
// ══════════════════════════════
function loadData() {
  try {
    const raw = localStorage.getItem('party_roster_v1');
    members = raw ? JSON.parse(raw) : [];
  } catch { members = []; }
}

function saveData() {
  try { localStorage.setItem('party_roster_v1', JSON.stringify(members)); } catch {
    showToast('Storage full — try removing large photos.');
  }
}

// ══════════════════════════════
//  RENDER
// ══════════════════════════════
function render() {
  updateStats();
  const grid = document.getElementById('rosterGrid');

  if (!members.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <span class="ei">👥</span>
        <p>No crew members registered — add your first member</p>
      </div>
      <div class="add-card" onclick="openModal()">
        <div class="add-card-icon">+</div>
        <div class="add-card-label">Recruit Member</div>
      </div>`;
    return;
  }

  grid.innerHTML = members.map((m, idx) => {
    const color = m.color || COLORS[idx % COLORS.length];
    const initials = m.name ? m.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase() : '?';
    const portraitContent = m.photo
      ? `<img class="portrait-img" src="${m.photo}" alt="${esc(m.name)}" />`
      : `<div class="portrait-initials">${initials}</div>`;
    const tags = (m.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
    const statusColors = { active: 'var(--green)', retired: 'var(--amber)', deceased: 'var(--red)', missing: 'var(--cyan)' };
    const statusColor = statusColors[m.status] || 'var(--text-dim)';

    return `
    <div class="member-card" style="--member-color:${color}" data-id="${m.id}">
      <div class="card-portrait-area">
        <div class="portrait-ring" style="border-color:${color};box-shadow:0 0 14px ${color}40"
             onclick="triggerPhotoUpload('${m.id}')" title="Click to change portrait">
          ${portraitContent}
          <div class="portrait-upload-hint">
            CHANGE<br>PORTRAIT
            <input type="file" id="inline-photo-${m.id}" accept="image/*" style="display:none"
                   onchange="handleInlinePhoto(event,'${m.id}')" />
          </div>
        </div>
        <div class="card-id-area">
          <div class="member-name">${esc(m.name)}</div>
          ${m.class ? `<div class="member-class" style="color:${color}">${esc(m.class)}</div>` : ''}
          ${m.race  ? `<div class="member-race">${esc(m.race)}</div>` : ''}
          ${m.level ? `<div class="member-level" style="background:${color};color:#050300">LVL ${m.level}</div>` : ''}
        </div>
      </div>
      <div class="card-body">
        ${m.bio ? `<div class="member-bio">"${esc(m.bio)}"</div>` : '<div class="member-bio" style="min-height:0"></div>'}
        ${tags ? `<div class="card-tags">${tags}</div>` : ''}
      </div>
      <div class="card-footer">
        <div class="member-player">
          ${m.player ? `PLAYER: <span>${esc(m.player)}</span>` : ''}
          <span style="color:${statusColor};margin-left:${m.player?'8px':'0'}">${STATUS_LABEL[m.status]||'Active'}</span>
        </div>
        <div class="card-actions">
          <button class="btn-icon" onclick="openModal('${m.id}')" title="Edit">✎</button>
          <button class="btn-icon del" onclick="deleteMember('${m.id}')" title="Remove">🗑</button>
        </div>
      </div>
    </div>`;
  }).join('') +
  `<div class="add-card" onclick="openModal()">
    <div class="add-card-icon">+</div>
    <div class="add-card-label">Recruit Member</div>
  </div>`;
}

function updateStats() {
  document.getElementById('statTotal').textContent = members.length;
  const levels = members.map(m=>m.level).filter(Boolean);
  document.getElementById('statAvgLevel').textContent = levels.length
    ? (levels.reduce((a,b)=>a+b,0)/levels.length).toFixed(1)
    : '—';
  const classes = [...new Set(members.map(m=>m.class).filter(Boolean))];
  document.getElementById('statUniqueClasses').textContent = classes.length;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ══════════════════════════════
//  PHOTO HANDLING
// ══════════════════════════════
function handlePhotoUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    currentPhoto = ev.target.result;
    const preview = document.getElementById('photoPreview');
    preview.innerHTML = `<img src="${currentPhoto}" alt="portrait" style="width:100%;height:100%;object-fit:cover;border-radius:50%" />`;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function clearPhoto() {
  currentPhoto = null;
  document.getElementById('photoPreview').innerHTML = `<span class="photo-initials" id="photoInitials">${getInitials()}</span>`;
}

function getInitials() {
  const name = document.getElementById('f-name')?.value || '';
  return name ? name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase() : '?';
}

function triggerPhotoUpload(id) {
  document.getElementById(`inline-photo-${id}`)?.click();
}

function handleInlinePhoto(e, id) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const idx = members.findIndex(m => m.id === id);
    if (idx < 0) return;
    members[idx].photo = ev.target.result;
    saveData(); render();
    showToast('Portrait updated.');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

// ══════════════════════════════
//  MODAL
// ══════════════════════════════
function openModal(id) {
  editId = id || null;
  document.getElementById('modalTitle').textContent = id ? '⚙ EDIT CREW MEMBER' : '⚙ ADD CREW MEMBER';

  if (id) {
    const m = members.find(x => x.id === id);
    if (!m) return;
    document.getElementById('f-name').value   = m.name || '';
    document.getElementById('f-player').value = m.player || '';
    document.getElementById('f-class').value  = m.class || '';
    document.getElementById('f-race').value   = m.race || '';
    document.getElementById('f-level').value  = m.level || '';
    document.getElementById('f-status').value = m.status || 'active';
    document.getElementById('f-bio').value    = m.bio || '';
    document.getElementById('f-tags').value   = (m.tags||[]).join(', ');
    currentColor = m.color || COLORS[0];
    currentPhoto = m.photo || null;
    const preview = document.getElementById('photoPreview');
    if (currentPhoto) {
      preview.innerHTML = `<img src="${currentPhoto}" alt="portrait" style="width:100%;height:100%;object-fit:cover;border-radius:50%" />`;
    } else {
      const initials = (m.name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      preview.innerHTML = `<span class="photo-initials">${initials}</span>`;
    }
  } else {
    ['f-name','f-player','f-class','f-race','f-level','f-bio','f-tags'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
    document.getElementById('f-status').value = 'active';
    currentColor = COLORS[Math.floor(Math.random() * COLORS.length)];
    currentPhoto = null;
    document.getElementById('photoPreview').innerHTML = `<span class="photo-initials">?</span>`;
  }

  buildColorSwatches();
  document.getElementById('memberModal').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 150);
}

function closeModal() {
  document.getElementById('memberModal').classList.remove('open');
  editId = null;
}

function backdropClose(e) {
  if (e.target === document.getElementById('memberModal')) closeModal();
}

function updateModalPreview() {
  const name = document.getElementById('f-name').value;
  const initials = name ? name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase() : '?';
  if (!currentPhoto) {
    const el = document.getElementById('photoPreview');
    el.innerHTML = `<span class="photo-initials">${initials}</span>`;
  }
}

function saveMember() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { showToast('Character name required.'); return; }

  const tagsRaw = document.getElementById('f-tags').value;
  const tags = tagsRaw.split(',').map(t=>t.trim()).filter(Boolean);

  const member = {
    id:     editId || uid(),
    name,
    player: document.getElementById('f-player').value.trim(),
    class:  document.getElementById('f-class').value.trim(),
    race:   document.getElementById('f-race').value.trim(),
    level:  parseInt(document.getElementById('f-level').value) || null,
    status: document.getElementById('f-status').value,
    bio:    document.getElementById('f-bio').value.trim(),
    tags,
    color:  currentColor,
    photo:  currentPhoto,
  };

  if (editId) {
    const i = members.findIndex(m => m.id === editId);
    if (i >= 0) members[i] = member;
    showToast('Member updated.');
  } else {
    members.push(member);
    showToast(`${name} added to the roster.`);
  }

  saveData(); render(); closeModal();
}

function deleteMember(id) {
  const m = members.find(x => x.id === id);
  if (!m) return;
  if (!confirm(`Remove ${m.name} from the roster?`)) return;
  members = members.filter(x => x.id !== id);
  saveData(); render(); showToast('Member removed.');
}

// ══════════════════════════════
//  COLOR SWATCHES
// ══════════════════════════════
function buildColorSwatches() {
  document.getElementById('modalColorRow').innerHTML =
    COLORS.map(c => `
      <div class="cswatch ${c===currentColor?'sel':''}" style="background:${c}"
           onclick="selectColor('${c}')" title="${c}"></div>
    `).join('') +
    `<div class="color-custom-wrap" title="Custom color">
      <div class="cc-bg">+</div>
      <input type="color" value="${currentColor}" oninput="selectColor(this.value)" onchange="selectColor(this.value)" />
    </div>`;
}

function selectColor(c) {
  currentColor = c;
  document.querySelectorAll('.cswatch').forEach(s =>
    s.classList.toggle('sel', s.getAttribute('onclick') === `selectColor('${c}')`)
  );
}

// ══════════════════════════════
//  EXPORT / IMPORT
// ══════════════════════════════
function exportJSON() {
  const blob = new Blob([JSON.stringify({ version:1, members }, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'party-roster.json'; a.click();
  showToast('Roster exported.');
}

function importJSON() { document.getElementById('fileImport').click(); }

function handleImport(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      const imported = d.members || d;
      if (!Array.isArray(imported)) throw new Error();
      if (confirm(`Import ${imported.length} members? This replaces your current roster.`)) {
        members = imported.map(m => ({ ...m, id: m.id || uid() }));
        saveData(); render(); showToast(`Imported ${members.length} members.`);
      }
    } catch { showToast('Invalid file.'); }
  };
  r.readAsText(file); e.target.value = '';
}

// ══════════════════════════════
//  TOAST
// ══════════════════════════════
function showToast(msg, dur=2800) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._to); t._to = setTimeout(() => t.classList.remove('show'), dur);
}

// ══════════════════════════════
//  KEYBOARD
// ══════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && document.getElementById('memberModal').classList.contains('open') && document.activeElement.tagName !== 'TEXTAREA') saveMember();
});

// ══════════════════════════════
//  INIT
// ══════════════════════════════
loadData();
render();
</script>
</body>
</html>
